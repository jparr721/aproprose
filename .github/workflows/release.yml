name: Release

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  guard:
    name: version guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Validate the main push and immutable release version
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$COMMIT_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::releases must build the exact commit of a successful main push"
            exit 1
          fi
          version="$(bun run scripts/check-release.ts "$BASE_SHA")"
          if [ "$version" != "$RELEASE_VERSION" ] || [ "$(git rev-parse HEAD)" != "$COMMIT_SHA" ]; then
            echo "::error::release inputs do not match the checked-out version and commit"
            exit 1
          fi
          tag="v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [ "$(git rev-parse "$tag^{commit}")" != "$COMMIT_SHA" ]; then
              echo "::error::tag $tag already points at a different commit"
              exit 1
            fi
          fi
          highest="$(git tag --merged "$BASE_SHA" --list 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -n1 || true)"
          if [ -n "$highest" ]; then
            newest="$(printf '%s\n%s\n' "$tag" "$highest" | sort -V | tail -n1)"
            if [ "$tag" = "$highest" ] || [ "$newest" != "$tag" ]; then
              echo "::error::version $version must be greater than ancestor release $highest"
              exit 1
            fi
          fi
          echo "Release validated: $tag at $COMMIT_SHA"

  create-release:
    name: create draft release
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Create or resume the draft release for this commit
        id: create-release
        uses: actions/github-script@v7
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          result-encoding: string
          script: |
            const { execFileSync } = require('child_process');
            const version = process.env.RELEASE_VERSION;
            const sha = process.env.COMMIT_SHA;
            const tag = `v${version}`;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const body = execFileSync('bun', ['run', 'scripts/release-body.ts', version], {
              encoding: 'utf8',
            }).trimEnd();
            const releases = await github.paginate(github.rest.repos.listReleases, { ...repo, per_page: 100 });
            const existing = releases.find((release) => release.tag_name === tag);
            if (existing) {
              if (!existing.draft) throw new Error(`Published release ${tag} cannot be modified`);
              if (existing.target_commitish !== sha) throw new Error(`Draft ${tag} must target ${sha}; found ${existing.target_commitish}`);
              if (existing.body !== body) throw new Error(`Draft ${tag} does not match the checked-in changelog`);
            }
            let reference;
            try {
              reference = (await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` })).data.object;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (reference) {
              while (reference.type === 'tag') {
                reference = (await github.rest.git.getTag({ ...repo, tag_sha: reference.sha })).data.object;
              }
              if (reference.type !== 'commit' || reference.sha !== sha) {
                throw new Error(`Tag ${tag} must point at ${sha}; found ${reference.type} ${reference.sha}`);
              }
            } else {
              await github.rest.git.createRef({ ...repo, ref: `refs/tags/${tag}`, sha });
            }
            if (existing) {
              core.info(`Resuming draft ${tag} for ${sha}`);
              return existing.id;
            }
            const { data } = await github.rest.repos.createRelease({
              ...repo,
              tag_name: tag,
              target_commitish: sha,
              name: `aproprose ${tag}`,
              body,
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    name: build ${{ matrix.platform }}
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # tauri-action merges latest.json by read/delete/upload, so serialize its writers.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            bundle_directory: src-tauri/target/aarch64-apple-darwin/release/bundle
          - platform: ubuntu-22.04
            target: ""
            args: "--bundles deb,appimage"
            bundle_directory: src-tauri/target/release/bundle
          - platform: windows-latest
            target: ""
            args: "--bundles nsis"
            bundle_directory: src-tauri/target/release/bundle
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        # The build matrix includes windows-latest, where the default shell is
        # PowerShell. Force bash (Git Bash on Windows) so every run step's POSIX
        # script - notably the updater-notes heredoc below - works on all platforms.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Install Tauri system deps (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file zstd \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xdotool dbus-x11
      - uses: oven-sh/setup-bun@v2
      - uses: extractions/setup-just@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: bun install --frozen-lockfile
      - name: Build the updater changelog notes for this version
        id: notes
        # tauri-action defaults latest.json `notes` to a generic download message.
        # The in-app updater surfaces `notes` as the upcoming version's changelog
        # ("See changes"), so feed it the real entry via releaseBody - the same body
        # release-body.ts builds for the GitHub release, which parseUpdateNotes inverts.
        run: |
          set -euo pipefail
          {
            echo 'body<<RELEASE_BODY_EOF'
            bun run scripts/release-body.ts "$RELEASE_VERSION"
            echo
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - name: Require the release to remain a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.draft')" != "true" ]; then
            echo "::error::published release assets cannot be modified"
            exit 1
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: v${{ inputs.version }}
          releaseCommitish: ${{ inputs.commit_sha }}
          releaseDraft: true
          releaseBody: ${{ steps.notes.outputs.body }}
          args: ${{ matrix.args }}
      - name: Smoke the actual Linux release bundle
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- just smoke-artifact "${{ matrix.bundle_directory }}"
      - name: Smoke the actual desktop release bundle
        if: runner.os != 'Linux'
        run: just smoke-artifact "${{ matrix.bundle_directory }}"
      # Runs after tauri-action so it packages the very binary tauri just built.
      # Building it here with bare `cargo build --release` would produce a dev-mode
      # binary (no embedded frontend) that fails to start - see the script's guard.
      - name: Package for Arch Linux
        if: matrix.platform == 'ubuntu-22.04'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/create-arch-package.sh "$RELEASE_VERSION"
      - name: Upload Arch Linux package
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          # Address the release by id, not by tag: it is still a draft at this point, so the
          # id is the unambiguous handle. Asset uploads go to uploads.github.com, not the API host.
          pkg="$(ls aproprose-*.pkg.tar.zst)"
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.draft')" != "true" ]; then
            echo "::error::published release assets cannot be modified"
            exit 1
          fi
          asset_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq ".[] | select(.name==\"$(basename "$pkg")\") | .id")"
          if [ -n "$asset_id" ]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          fi
          gh api --method POST \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=$(basename "$pkg")" \
            --input "$pkg"

  publish-release:
    name: verify and publish
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: extractions/setup-just@v3
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - run: bun install --frozen-lockfile
      - name: Download draft assets by release ID, verify signatures, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          RELEASE_VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          release_ref="refs/tags/v${RELEASE_VERSION}"
          git fetch --no-tags origin "+${release_ref}:${release_ref}"
          if [ "$(git rev-parse "${release_ref}^{commit}")" != "$COMMIT_SHA" ]; then
            echo "::error::the release tag moved after validation"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "$RUNNER_TEMP/release.json"
          jq -e --arg tag "v$RELEASE_VERSION" --arg sha "$COMMIT_SHA" \
            '.draft == true and .tag_name == $tag and .target_commitish == $sha' "$RUNNER_TEMP/release.json" >/dev/null
          download_directory="$RUNNER_TEMP/release-assets"
          mkdir -p "$download_directory"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | [.id, .name] | @tsv' > "$RUNNER_TEMP/release-assets.tsv"
          while IFS=$'\t' read -r asset_id asset_name; do
            if [[ ! "$asset_id" =~ ^[0-9]+$ || "$asset_name" == */* || "$asset_name" == *\\* || "$asset_name" == "." || "$asset_name" == ".." ]]; then
              echo "::error::invalid release asset identity"
              exit 1
            fi
            gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              -H "Accept: application/octet-stream" > "$download_directory/$asset_name"
          done < "$RUNNER_TEMP/release-assets.tsv"
          notes="$(jq -r '.notes' "$download_directory/latest.json")"
          expected_notes="$(bun run scripts/release-body.ts "$RELEASE_VERSION")"
          if [ "$notes" != "$expected_notes" ]; then
            echo "::error::latest.json notes do not match the checked-in changelog for this version"
            exit 1
          fi
          just verify-release-assets "$download_directory" "$RELEASE_VERSION" "$GITHUB_REPOSITORY"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false -F prerelease=false -f make_latest=legacy
